let currentQuery='',actualSearchQuery='',currentWikiUrl='';
let searchResults=[],searchHistory=[],currentCategory='general',currentResultIndex=0;
function loadHistory(){const saved=localStorage.getItem('kodboga_history');if(saved){searchHistory=JSON.parse(saved);updateHistoryDisplay()}}
function addToHistory(query){if(!searchHistory)searchHistory=[];if(searchHistory.indexOf(query)===-1){searchHistory.unshift(query);if(searchHistory.length>10)searchHistory.pop();localStorage.setItem('kodboga_history',JSON.stringify(searchHistory));updateHistoryDisplay()}}
function updateHistoryDisplay(){const section=document.getElementById('historySection');const list=document.getElementById('historyList');if(searchHistory&&searchHistory.length>0){section.style.display='block';list.innerHTML='';searchHistory.forEach(function(item){const div=document.createElement('div');div.className='history-item';div.textContent='🔹 '+item;div.onclick=function(){document.getElementById('query').value=item;activate()};list.appendChild(div)})}}
function quickSearch(query){document.getElementById('query').value=query;activate()}
async function activate(){const rawQuery=document.getElementById('query').value.trim().toLowerCase();if(!rawQuery){alert('Введите запрос!');return}currentQuery=rawQuery;currentCategory=detectCategory(rawQuery);actualSearchQuery=smartDictionary[rawQuery]||rawQuery;if(actualSearchQuery===rawQuery){const words=rawQuery.split(/\s+/);for(const word of words){if(smartDictionary[word]){actualSearchQuery=smartDictionary[word];break}}}document.getElementById('result').style.display='block';document.getElementById('resultTitle').textContent='🔍 Поиск...';document.getElementById('resultText').textContent='Ищу в базе знаний...';document.getElementById('resultImage').style.display='none';document.getElementById('placeholderImage').style.display='flex';document.getElementById('placeholderIcon').textContent=getIconForQuery(rawQuery);document.getElementById('placeholderText').textContent='Ищу: '+actualSearchQuery;document.getElementById('imageBadge').style.display='none';document.getElementById('variants').style.display='none';if(actualSearchQuery!==rawQuery){document.getElementById('smartHint').textContent='💡 Нашёл в словаре: "'+actualSearchQuery+'"'}else{document.getElementById('smartHint').textContent=''}try{searchResults=await searchWikipediaMultiple(actualSearchQuery);if(searchResults.length>0){currentResultIndex=0;showResult(searchResults[0]);if(searchResults.length>1)showVariants(searchResults.slice(1))}else{document.getElementById('resultTitle').textContent='❌ Не найдено';document.getElementById('resultText').textContent='Попробуй написать по-другому.';showPlaceholder(getIconForQuery(rawQuery),'Не найдено. Попробуй другой запрос!')}}catch(error){document.getElementById('resultTitle').textContent='⚠️ Ошибка';document.getElementById('resultText').textContent='Проверь интернет.'}addToHistory(rawQuery)}

async function randomQuery(){document.getElementById('result').style.display='block';document.getElementById('resultTitle').textContent='🎲 Загружаю случайную статью...';document.getElementById('resultText').textContent='Подожди секунду...';document.getElementById('resultImage').style.display='none';document.getElementById('placeholderImage').style.display='flex';document.getElementById('placeholderIcon').textContent='🎲';document.getElementById('placeholderText').textContent='Ищу что-то интересное...';document.getElementById('imageBadge').style.display='none';document.getElementById('variants').style.display='none';document.getElementById('smartHint').textContent='';try{const r=await fetch('https://ru.wikipedia.org/api/rest_v1/page/random/summary');const d=await r.json();currentWikiUrl=d.content_urls?d.content_urls.desktop.page:'';document.getElementById('resultTitle').textContent='📖 '+d.title;document.getElementById('resultText').textContent=d.extract||'Описание недоступно';if(d.thumbnail){const img=document.getElementById('resultImage');img.onload=function(){img.style.display='block';document.getElementById('placeholderImage').style.display='none'};img.onerror=function(){document.getElementById('placeholderIcon').textContent='📄';document.getElementById('placeholderText').textContent='Нет фото'};img.src=d.thumbnail.source;document.getElementById('imageBadge').textContent='Wiki RU';document.getElementById('imageBadge').style.display='block'}else{document.getElementById('placeholderIcon').textContent='📄';document.getElementById('placeholderText').textContent='Нет фото в Wikipedia'}addToHistory(d.title)}catch(e){document.getElementById('resultTitle').textContent='⚠️ Ошибка';document.getElementById('resultText').textContent='Проверь интернет'}}
async function searchWikipediaMultiple(query){try{const url='https://ru.wikipedia.org/w/api.php?action=query&list=search&srsearch='+encodeURIComponent(query)+'&format=json&origin=*&srlimit=10';const response=await fetch(url);if(!response.ok)throw new Error('Network error');const data=await response.json();if(!data.query||!data.query.search||data.query.search.length===0)return[{title:query,extract:'Не удалось найти информацию.',url:'https://ru.wikipedia.org/wiki/Special:Search?search='+encodeURIComponent(query),thumbnail:null}];const results=[];const queryLower=query.toLowerCase();for(let i=0;i<data.query.search.length;i++){const item=data.query.search[i];const detail=await getWikipediaDetail(item.title);if(detail){const title=detail.title.toLowerCase();if(isCityQuery(queryLower)){if(title.includes('губерния')||title.includes('уезд')||title.includes('империя')||title.includes('история'))continue}if(queryLower.includes('космос')||queryLower.includes('вселенн')){if(title.includes('dc')||title.includes('marvel')||title.includes('киновселен')||title.includes('комикс'))continue}results.push(detail)}}results.sort(function(a,b){const aExact=a.title.toLowerCase()===queryLower;const bExact=b.title.toLowerCase()===queryLower;if(aExact)return-1;if(bExact)return 1;return 0});if(results.length===0)return[{title:query,extract:'Не удалось найти информацию.',url:'https://ru.wikipedia.org/wiki/Special:Search?search='+encodeURIComponent(query),thumbnail:null}];return results}catch(error){return[{title:query,extract:'Ошибка подключения. Проверьте интернет.',url:'https://ru.wikipedia.org/wiki/Special:Search?search='+encodeURIComponent(query),thumbnail:null}]}}
function isCityQuery(query){const cities=['новороссийск','краснодар','москва','питер','сочи','анапа','геленджик','екатеринбург','казань','самара','омск','челябинск','ростов','уфа','красноярск','воронеж','пермь','волгоград','владивосток','саратов','тюмень','тольятти','барнаул','иркутск','хабаровск','ярославль','махачкала','томск','оренбург','кемерово','новокузнецк','астрахань','пенза','липецк','киров','чебоксары','тула','калининград','курск','брянск','магнитогорск','иваново','тверь','ставрополь','белгород','архангельск','владимир','курган','смоленск','калуга','чита','орёл','мурманск','сургут','вологда','саранск','тамбов','грозный','кострома','петрозаводск','нальчик','братск','шахты','ангарск','благовещенск','подольск','псков','севастополь','симферополь','ялта','керчь','евпатория','феодосия'];return cities.some(function(city){return query.includes(city)})}
async function getWikipediaDetail(title){try{const url='https://ru.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(title);const response=await fetch(url);if(!response.ok)return null;const data=await response.json();return{title:data.title,extract:data.extract,url:data.content_urls&&data.content_urls.desktop?data.content_urls.desktop.page:'',thumbnail:data.thumbnail?data.thumbnail.source:null}}catch(error){return null}}
function showResult(result){currentWikiUrl=result.url;document.getElementById('resultTitle').textContent='📖 '+result.title;document.getElementById('resultText').textContent=result.extract||'Описание недоступно';if(result.thumbnail){const img=document.getElementById('resultImage');img.onload=function(){img.style.display='block';document.getElementById('placeholderImage').style.display='none'};img.onerror=function(){showPlaceholder(getIconForQuery(currentQuery),'Фото не загрузилось')};img.src=result.thumbnail;document.getElementById('imageBadge').textContent='Wiki RU';document.getElementById('imageBadge').style.display='block'}else{showPlaceholder(getIconForQuery(currentQuery),'Нет фото в Wikipedia')}}
function showVariants(variants){const list=document.getElementById('variantsList');list.innerHTML='';const filtered=filterByCategory(variants,currentCategory);const toShow=filtered.length>0?filtered:variants;toShow.forEach(function(v){const div=document.createElement('div');div.className='variant-item';div.textContent='→ '+v.title;div.onclick=function(){showResult(v)};list.appendChild(div)});document.getElementById('variants').style.display='block'}
